{% extends "base.html" %}
{% block title %}Reports{% endblock %}
{% block heading %}Reports{% endblock %}
{% block content %}
<div class="card p-3 mb-3">
  <form class="row g-2 align-items-end" id="reportForm">
    <div class="col-md-3"><label class="form-label" for="rType">Report</label>
      <select class="form-select" id="rType">
        <option value="daily">Daily attendance</option><option value="monthly">Monthly attendance</option>
        <option value="individual">Individual attendance</option><option value="department">Department-wise analysis</option>
      </select></div>
    <div class="col-md-2 f-daily"><label class="form-label" for="rDate">Date</label><input class="form-control" type="date" id="rDate"></div>
    <div class="col-md-3 f-daily"><label class="form-label" for="rDept">Department</label>
      <select class="form-select" id="rDept"><option value="">All</option>{% for d in departments %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}</select></div>
    <div class="col-md-2 f-monthly d-none"><label class="form-label" for="rMonth">Month</label><input class="form-control" type="month" id="rMonth"></div>
    <div class="col-md-3 f-individual d-none"><label class="form-label" for="rStudent">Person</label>
      <select class="form-select" id="rStudent"><option value="">Choose...</option>{% for s in students %}<option value="{{ s.student_code }}">{{ s.name }} ({{ s.student_code }})</option>{% endfor %}</select></div>
    <div class="col-md-2 f-range d-none"><label class="form-label" for="rFrom">From</label><input class="form-control" type="date" id="rFrom"></div>
    <div class="col-md-2 f-range d-none"><label class="form-label" for="rTo">To</label><input class="form-control" type="date" id="rTo"></div>
    <div class="col-md-auto"><button class="btn btn-brand" type="submit">Show report</button></div>
  </form>
</div>

<div class="card p-3 d-none" id="reportCard">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <h2 class="h6 m-0" id="reportTitle"></h2>
    <div class="btn-group btn-group-sm">
      <a class="btn btn-outline-secondary" id="dlCsv"><i class="bi bi-filetype-csv me-1"></i>CSV</a>
      <a class="btn btn-outline-secondary" id="dlXlsx"><i class="bi bi-file-earmark-excel me-1"></i>Excel</a>
      <a class="btn btn-outline-secondary" id="dlPdf"><i class="bi bi-file-earmark-pdf me-1"></i>PDF</a>
    </div>
  </div>
  <div class="chart-box mb-3"><canvas id="reportChart"></canvas></div>
  <div class="table-responsive"><table class="table table-sm align-middle mb-0"><thead id="reportHead"></thead><tbody id="reportBody"></tbody></table></div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/reports.js') }}"></script>
{% endblock %}
