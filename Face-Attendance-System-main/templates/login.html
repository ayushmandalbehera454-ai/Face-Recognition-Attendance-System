<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | FaceTrack Attendance</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light');</script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-brand"><i class="bi bi-person-bounding-box"></i> FaceTrack</div>
    <h1 class="h4 mb-1">Admin sign in</h1>
    <p class="text-secondary mb-4">Manage people, attendance and reports.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="alert alert-{{ cat if cat in ('success','danger','warning','info') else 'info' }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label" for="username">Username</label>
      <input class="form-control mb-3" id="username" name="username" autocomplete="username" required autofocus>
      <label class="form-label" for="password">Password</label>
      <input class="form-control mb-4" id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn btn-brand w-100" type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
